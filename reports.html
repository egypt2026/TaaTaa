<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>تقرير حسابات أولاد طاطا</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet"><style>
:root{--bg:#faf6f0;--cd:#fff;--tx:#222;--mu:#777;--pr:#e8710a;--gr:#1f7a3a;--bd:#eadfce;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#151311;--cd:#211e1b;--tx:#f2ece4;--mu:#a99f93;--bd:#3a342d;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:Cairo,Tahoma,sans-serif;padding-bottom:90px}
header{background:#f58220;color:#fff;text-align:center;padding:10px 12px 12px;border-bottom:6px solid var(--gr)}
header img{width:100%;max-width:260px;display:block;margin:auto}header p{margin:2px 0 0;font-size:13px;font-weight:700}
.bar{position:sticky;top:0;background:var(--bg);z-index:5;padding:8px 10px;border-bottom:1px solid var(--bd)}
input,select,textarea,button{font:inherit;color:var(--tx)}
.bar input{width:100%;padding:11px 14px;border:1px solid var(--bd);border-radius:24px;background:var(--cd)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 0 0}.chips button{white-space:nowrap;border:1px solid var(--bd);background:var(--cd);padding:7px 14px;border-radius:20px;cursor:pointer}
.chips button.on{background:var(--pr);color:#fff;border-color:var(--pr)}
main{padding:10px;max-width:900px;margin:auto}h2{margin:18px 0 8px}.st{color:#fff;text-align:center;padding:11px 14px;border-radius:12px;font-size:19px;box-shadow:0 2px 6px #0003}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:10px}
.c{background:var(--cd);border:1px solid var(--bd);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.im{height:90px;background:linear-gradient(135deg,#ffe9d0,#d9f0e0);display:flex;align-items:center;justify-content:center;font-size:42px}.im img{width:100%;height:100%;object-fit:cover}
.c .b{padding:8px;display:flex;flex-direction:column;gap:6px;flex:1}.c .n{font-weight:700;font-size:14px;flex:1}.pr{color:var(--pr);font-weight:700}.pr small{color:var(--mu);font-weight:400}
.btn{background:var(--pr);color:#fff;border:0;border-radius:10px;padding:8px;cursor:pointer;font-weight:700}.btn.g2{background:var(--gr)}
.q{display:flex;align-items:center;justify-content:space-between}.q button{width:32px;height:32px;border-radius:50%;border:0;background:var(--pr);color:#fff;font-size:18px;cursor:pointer}
#fc{position:fixed;inset:auto 10px calc(10px + env(safe-area-inset-bottom,0px)) 10px;max-width:880px;margin:auto;background:var(--gr);color:#fff;border-radius:16px;padding:14px 18px;display:none;justify-content:space-between;cursor:pointer;font-weight:700;box-shadow:0 4px 16px #0005;z-index:9}
.md{position:fixed;inset:0;background:#0009;z-index:20;display:none;align-items:flex-end;justify-content:center}.md>div{background:var(--bg);width:100%;max-width:700px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px}
.md.sh{display:flex}.f input,.f select,.f textarea{width:100%;padding:10px;margin:5px 0;border:1px solid var(--bd);border-radius:10px;background:var(--cd)}
.ln{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--bd);gap:8px}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:5px;border-bottom:1px solid var(--bd);text-align:right}td input{width:100%;padding:5px;border:1px solid var(--bd);border-radius:6px;background:var(--cd)}
.k{display:inline-block;background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:10px 14px;margin:4px;text-align:center}.k b{display:block;font-size:20px;color:var(--pr)}
</style></head><body><header><h1 style="margin:6px;font-size:20px">تقرير حسابات أولاد طاطا</h1></header><div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const SB_URL='https://lnfwwkumsnoqiiwrnxzd.supabase.co',SB_KEY='sb_publishable_Tv-gLDwCAHtTOsJll3_3Kw_ilab-B36';
const sb=supabase.createClient(SB_URL,SB_KEY);
const AL=[]; // ضع هنا الإيميلات المسموح لها بدخول هذه الصفحة بين علامتي '' وافصل بينها بفاصلة. إذا تركتها فارغة يدخل أي مستخدم مسجل
const $=s=>document.querySelector(s),v=id=>($('#'+id)||{}).value||'';
const E=r=>{if(r.error){alert('خطأ: '+r.error.message);return 0}return 1};
async function boot(){let t=await sb.auth.getSession(),u=t.data.session&&t.data.session.user;if(u&&(!AL.length||AL.includes(u.email)))return P();LG(u?'هذا الحساب غير مسموح له بدخول هذه الصفحة':'')}
function LG(m){$('#app').innerHTML=`<main style="max-width:380px;margin-top:40px"><div class="c" style="padding:20px"><h3 style="text-align:center">🔐 تقرير حسابات أولاد طاطا</h3>${m?`<p style="color:#c00;text-align:center">${m}</p>`:''}<div class="f"><input id="lu" placeholder="اليوزر (الإيميل)" autocomplete="username"><input id="lp" type="password" placeholder="الباسوورد" autocomplete="current-password" onkeydown="if(event.key=='Enter')lg()"></div><button class="btn" onclick="lg()">دخول</button></div></main>`}
async function lg(){let r=await sb.auth.signInWithPassword({email:v('lu'),password:v('lp')});if(r.error)return alert('اليوزر أو الباسوورد غير صحيح');boot()}
async function lo(){await sb.auth.signOut();LG('')}
const ST=['جديد','قيد التحضير','تم','ملغي'];let O=[];
async function P(){let r=await sb.from('orders').select('*').order('created_at',{ascending:false}).limit(3000);if(!E(r))return;O=r.data.map(o=>({id:o.id,d:new Date(o.created_at),m:o.mode,T:+o.total,l:o.lines||[],st:o.status,i:o.info||''}));
$('#app').innerHTML=`<main><button class="btn" style="background:var(--mu)" onclick="lo()">تسجيل خروج</button> <a class="btn" href="admin.html" style="text-decoration:none;display:inline-block">⚙️ إدارة الأصناف</a><h2>📊 تقرير الحسابات</h2><div class="f" style="display:flex;gap:6px;flex-wrap:wrap;align-items:center"><label>من <input type="date" id="f1" onchange="X()"></label><label>إلى <input type="date" id="f2" onchange="X()"></label><select id="fs" onchange="X()" style="width:auto"><option value="">كل الحالات</option>${ST.map(s=>`<option>${s}</option>`).join('')}</select><button class="btn g2" onclick="xl()">⬇️ تصدير إلى Excel</button></div><div id="rp"></div></main>`;X()}
function FL(){let a=v('f1'),b=v('f2'),s=v('fs');return O.filter(o=>(!a||o.d>=new Date(a+'T00:00:00'))&&(!b||o.d<=new Date(b+'T23:59:59'))&&(!s||o.st==s))}
function X(){let L=FL(),K=L.filter(o=>o.st!='ملغي'),S=a=>a.reduce((s,o)=>s+o.T,0),td=K.filter(o=>o.d.toDateString()==new Date().toDateString()),top={};K.forEach(o=>o.l.forEach(x=>{top[x.n]=(top[x.n]||0)+x.s}));
let tp=Object.entries(top).sort((a,b)=>b[1]-a[1]).slice(0,10);
$('#rp').innerHTML=`<div><span class="k"><b>${td.length}</b>طلبات اليوم</span><span class="k"><b>${S(td)}</b>مبيعات اليوم</span><span class="k"><b>${K.length}</b>عدد الطلبات</span><span class="k"><b>${S(K)}</b>إجمالي المبيعات</span><span class="k"><b>${K.length?Math.round(S(K)/K.length):0}</b>متوسط الفاتورة</span></div><p><b>الأكثر مبيعاً:</b> ${tp.map(x=>x[0]+' ('+x[1]+')').join(' • ')||'—'}</p><div style="overflow-x:auto"><table><tr><th>التاريخ</th><th>النوع</th><th>بيانات</th><th>الأصناف</th><th>الإجمالي</th><th>الحالة</th></tr>${L.slice(0,200).map(o=>`<tr><td>${o.d.toLocaleString('ar-EG')}</td><td>${o.m}</td><td>${o.i}</td><td>${o.l.map(x=>x.n+'×'+x.q).join('، ')}</td><td>${o.T}</td><td><select onchange="us(${o.id},this.value)">${ST.map(s=>`<option ${s==o.st?'selected':''}>${s}</option>`).join('')}</select></td></tr>`).join('')}</table></div>`}
async function us(id,s){if(!E(await sb.from('orders').update({status:s}).eq('id',id)))return;O.find(x=>x.id==id).st=s;X()}
function xl(){if(!window.XLSX)return alert('مكتبة Excel لم تُحمَّل، تأكد من الاتصال بالإنترنت');let L=FL(),t={};
let rows=L.map(o=>({'التاريخ':o.d.toLocaleString('ar-EG'),'النوع':o.m,'بيانات الزبون':o.i,'الأصناف':o.l.map(x=>x.n+' × '+x.q).join('، '),'الإجمالي':o.T,'الحالة':o.st}));
L.filter(o=>o.st!='ملغي').forEach(o=>o.l.forEach(x=>{t[x.n]=t[x.n]||{'الصنف':x.n,'الكمية':0,'المبيعات':0};t[x.n]['الكمية']+=x.q;t[x.n]['المبيعات']+=x.s}));
let wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),'الطلبات');XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(Object.values(t).sort((a,b)=>b['المبيعات']-a['المبيعات'])),'مبيعات الأصناف');wb.Workbook={Views:[{RTL:true}]};
XLSX.writeFile(wb,'تقرير-أولاد-طاطا-'+new Date().toISOString().slice(0,10)+'.xlsx')}
boot();
</script></body></html>
