<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>منيو أولاد طاطا</title>
<style>
:root{--bg:#faf6f0;--cd:#fff;--tx:#222;--mu:#777;--pr:#e8710a;--gr:#1f7a3a;--bd:#eadfce;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#151311;--cd:#211e1b;--tx:#f2ece4;--mu:#a99f93;--bd:#3a342d;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:Tahoma,"Segoe UI",sans-serif;padding-bottom:90px}
header{background:#f58220;color:#fff;text-align:center;padding:10px 12px 12px;border-bottom:6px solid var(--gr)}
header img{width:100%;max-width:260px;display:block;margin:auto}header p{margin:2px 0 0;font-size:13px;font-weight:700}
.bar{position:sticky;top:0;background:var(--bg);z-index:5;padding:8px 10px;border-bottom:1px solid var(--bd)}
input,select,textarea,button{font:inherit;color:var(--tx)}
.bar input{width:100%;padding:11px 14px;border:1px solid var(--bd);border-radius:24px;background:var(--cd)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 0 0}.chips button{white-space:nowrap;border:1px solid var(--bd);background:var(--cd);padding:7px 14px;border-radius:20px;cursor:pointer}
.chips button.on{background:var(--pr);color:#fff;border-color:var(--pr)}
main{padding:10px;max-width:900px;margin:auto}h2{margin:18px 0 8px}.st{color:#fff;text-align:center;padding:11px 14px;border-radius:12px;font-size:19px;box-shadow:0 2px 6px #0003}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:10px}
.c{background:var(--cd);border:1px solid var(--bd);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.im{height:90px;background:linear-gradient(135deg,#ffe9d0,#d9f0e0);display:flex;align-items:center;justify-content:center;font-size:42px}.im img{width:100%;height:100%;object-fit:cover}
.c .b{padding:8px;display:flex;flex-direction:column;gap:6px;flex:1}.c .n{font-weight:700;font-size:14px;flex:1}.pr{color:var(--pr);font-weight:700}.pr small{color:var(--mu);font-weight:400}
.btn{background:var(--pr);color:#fff;border:0;border-radius:10px;padding:8px;cursor:pointer;font-weight:700}.btn.g2{background:var(--gr)}
.q{display:flex;align-items:center;justify-content:space-between}.q button{width:32px;height:32px;border-radius:50%;border:0;background:var(--pr);color:#fff;font-size:18px;cursor:pointer}
#fc{position:fixed;inset:auto 10px calc(10px + env(safe-area-inset-bottom,0px)) 10px;max-width:880px;margin:auto;background:var(--gr);color:#fff;border-radius:16px;padding:14px 18px;display:none;justify-content:space-between;cursor:pointer;font-weight:700;box-shadow:0 4px 16px #0005;z-index:9}
.md{position:fixed;inset:0;background:#0009;z-index:20;display:none;align-items:flex-end;justify-content:center}.md>div{background:var(--bg);width:100%;max-width:700px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px}
.md.sh{display:flex}.f input,.f select,.f textarea{width:100%;padding:10px;margin:5px 0;border:1px solid var(--bd);border-radius:10px;background:var(--cd)}
.ln{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--bd);gap:8px}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:5px;border-bottom:1px solid var(--bd);text-align:right}td input{width:100%;padding:5px;border:1px solid var(--bd);border-radius:6px;background:var(--cd)}
.k{display:inline-block;background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:10px 14px;margin:4px;text-align:center}.k b{display:block;font-size:20px;color:var(--pr)}
</style></head><body>
